[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "latticescholar"
version = "0.9.4"
description = "Local-first, evidence-grounded research intelligence workspace for scholars."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "CBarran498", email = "barranscipitstop@users.noreply.github.com" }]
keywords = ["research", "literature-review", "journal-recommendation", "academic", "local-first", "ai", "paper-analysis", "evidence-driven"]

classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "cryptography>=43,<47",
  "python-multipart>=0.0.12,<1",
  "pdfplumber>=0.11,<1",
  "pypdf>=5,<7",
  "uvicorn[standard]>=0.30,<1",
]

[project.urls]
Homepage = "https://github.com/CBarran498/LatticeScholar"
Repository = "https://github.com/CBarran498/LatticeScholar"
Issues = "https://github.com/CBarran498/LatticeScholar/issues"
Documentation = "https://github.com/CBarran498/LatticeScholar/tree/main/docs"

[project.optional-dependencies]
advanced-pdf = [
  "PyMuPDF>=1.24,<2",
  "pymupdf4llm>=0.0.27,<0.1",
]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
  "reportlab>=4,<5",
]

[project.scripts]
latticescholar = "latticescholar.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/latticescholar"]

[tool.hatch.build.targets.sdist]
include = [
  "src/latticescholar",
  "tests",
  "README.md",
  "README_EN.md",
  "LICENSE",
  "NOTICE",
  "THIRD_PARTY_NOTICES.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["latticescholar"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501", "UP006", "UP007", "UP035", "UP045"]
