name: Policy source monitor

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - run: >-
          python scripts/sync_policies.py --dry-run
          --source state-council --source most --source nsfc --source moe
          --json-report policy-sync-report.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: policy-sync-report
          path: policy-sync-report.json
          if-no-files-found: warn
