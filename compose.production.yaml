services:
  latticescholar:
    build: .
    expose:
      - "8765"
    volumes:
      - latticescholar-data:/data
    environment:
      LATTICE_DATA_DIR: /data
      LATTICE_PDF_ENGINE: ${LATTICE_PDF_ENGINE:-core}
      LATTICE_AUTH_MODE: ${LATTICE_AUTH_MODE:-accounts}
      LATTICE_SESSION_SECRET: ${LATTICE_SESSION_SECRET:?set LATTICE_SESSION_SECRET}
      LATTICE_SECURE_COOKIES: "true"
      LATTICE_DEV_AUTH: "false"
      LATTICE_ADMIN_EMAILS: ${LATTICE_ADMIN_EMAILS:?set LATTICE_ADMIN_EMAILS}
      LATTICE_SMTP_HOST: ${LATTICE_SMTP_HOST:?set LATTICE_SMTP_HOST}
      LATTICE_SMTP_PORT: ${LATTICE_SMTP_PORT:-587}
      LATTICE_SMTP_USERNAME: ${LATTICE_SMTP_USERNAME:-}
      LATTICE_SMTP_PASSWORD: ${LATTICE_SMTP_PASSWORD:-}
      LATTICE_SMTP_FROM_EMAIL: ${LATTICE_SMTP_FROM_EMAIL:?set LATTICE_SMTP_FROM_EMAIL}
      LATTICE_SMTP_USE_TLS: ${LATTICE_SMTP_USE_TLS:-true}
      LATTICE_PUBLIC_BASE_URL: ${LATTICE_PUBLIC_BASE_URL:?set LATTICE_PUBLIC_BASE_URL}
      LATTICE_REPOSITORY_URL: ${LATTICE_REPOSITORY_URL:-}
      LATTICE_POLICY_SYNC_INTERVAL_HOURS: ${LATTICE_POLICY_SYNC_INTERVAL_HOURS:-24}
      LATTICE_POLICY_SYNC_SOURCE_IDS: ${LATTICE_POLICY_SYNC_SOURCE_IDS:-state-council,most,nsfc,moe}
      LATTICE_LLM_PROVIDER: ${LATTICE_LLM_PROVIDER:-none}
      LATTICE_LLM_BASE_URL: ${LATTICE_LLM_BASE_URL:-http://host.docker.internal:11434}
      LATTICE_LLM_API_KEY: ${LATTICE_LLM_API_KEY:-}
      LATTICE_LLM_MODEL: ${LATTICE_LLM_MODEL:-qwen2.5:7b}
      LATTICE_ALLOW_REMOTE_LLM: ${LATTICE_ALLOW_REMOTE_LLM:-false}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      LATTICE_DEEPSEEK_BASE_URL: ${LATTICE_DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      LATTICE_DEEPSEEK_FAST_MODEL: ${LATTICE_DEEPSEEK_FAST_MODEL:-deepseek-v4-flash}
      LATTICE_DEEPSEEK_REASONING_MODEL: ${LATTICE_DEEPSEEK_REASONING_MODEL:-deepseek-v4-pro}
      LATTICE_DEEPSEEK_ROUTING: ${LATTICE_DEEPSEEK_ROUTING:-balanced}
      LATTICE_DEEPSEEK_THINKING: ${LATTICE_DEEPSEEK_THINKING:-adaptive}
      LATTICE_DEEPSEEK_REASONING_EFFORT: ${LATTICE_DEEPSEEK_REASONING_EFFORT:-high}
      LATTICE_DEEPSEEK_TIMEOUT_SECONDS: ${LATTICE_DEEPSEEK_TIMEOUT_SECONDS:-180}
      LATTICE_DEEPSEEK_MAX_RETRIES: ${LATTICE_DEEPSEEK_MAX_RETRIES:-1}
      CROSSREF_EMAIL: ${CROSSREF_EMAIL:-}
      SEMANTIC_SCHOLAR_API_KEY: ${SEMANTIC_SCHOLAR_API_KEY:-}
      OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
      NCBI_API_KEY: ${NCBI_API_KEY:-}
      NCBI_EMAIL: ${NCBI_EMAIL:-}
      WOS_API_KEY: ${WOS_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  caddy:
    image: caddy:2.10-alpine
    depends_on:
      - latticescholar
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  latticescholar-data:
  caddy-data:
  caddy-config:
